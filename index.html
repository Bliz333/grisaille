<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grisaille</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=Silkscreen:wght@400;700&family=ZCOOL+QingKe+HuangYou&family=Jacquard+24&family=Noto+Sans+SC:wght@400;700&display=swap">
<style>
:root {
  color-scheme: dark;
  --void: #0a0a0c; --ink: #121215; --ink2: #1c1c21; --dk: #36363d; --mid: #6c6c72; --lt: #a7a6a0;
  --paper: #d4d3cc; --white: #f6f5f0; --red: #ff3d4a; --gold: #ffc83d; --cyan: #40e4ff; --fire: #ff8a2a; --frost: #aee0ff; --violet: #b98aff;
  --disp: 'Silkscreen', 'ZCOOL QingKe HuangYou', 'PingFang SC', 'Microsoft YaHei', ui-monospace, monospace;
  --body: 'Pixelify Sans', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', ui-monospace, sans-serif;
  --head: 'Jacquard 24', 'ZCOOL QingKe HuangYou', 'Silkscreen', serif; /* pixel blackletter for big dungeon headings; Chinese falls back to ZCOOL */
  --rainbow: linear-gradient(90deg, #ff3d4a, #ff8a2a, #ffc83d, #4dff9a, #40e4ff, #b98aff, #ff3d4a);
}
html { font-size: clamp(11px, min(1.05vw, 2.1vh), 18px); } /* UI scales with the smaller screen side, like the game view */
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--void); color: var(--white); }
body { font-family: var(--body); cursor: none; user-select: none; -webkit-user-select: none; }
#cv { position: fixed; left: 0; top: 0; image-rendering: pixelated; image-rendering: crisp-edges; }
.ui { cursor: default; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }
kbd { font-family: var(--disp); font-size: .7rem; background: var(--white); color: var(--ink); padding: .1rem .35rem; box-shadow: 0 2px 0 var(--lt); }

/* ---------- HUD ---------- */
#hud { position: fixed; inset: 0; pointer-events: none; font-family: var(--disp); }
.plate { background: var(--ink); padding: .4rem .6rem; box-shadow: 3px 3px 0 rgba(0,0,0,.35); }
.tl { position: absolute; left: 16px; top: 14px; display: flex; flex-direction: column; align-items: flex-start; gap: .4rem; }
.pips { display: flex; gap: 3px; flex-wrap: wrap; max-width: 15rem; }
#hp i { width: .8rem; height: .8rem; background: #3b1d22; box-shadow: inset 0 0 0 2px #050506; }
#hp i.on { background: var(--red); box-shadow: inset 0 0 0 2px #050506, inset -3px -3px 0 rgba(0,0,0,.25); }
#sh { margin-top: 4px; }
#sh i { width: .62rem; height: .42rem; background: #26262b; }
#sh i.on { background: var(--white); }
.coinp { display: flex; align-items: center; gap: .4rem; font-size: .95rem; }
.coin { width: .55rem; height: .7rem; background: var(--gold); box-shadow: 0 0 0 2px #050506; }
#coins.bump { animation: bump .25s; }
@keyframes bump { 40% { transform: scale(1.35); color: var(--gold); } }
.tr { position: absolute; right: 16px; top: 14px; text-align: right; }
#floorName { font-size: .78rem; letter-spacing: .08em; color: var(--lt); }
#dots { display: flex; gap: 4px; justify-content: flex-end; margin-top: .3rem; }
#dots i { width: .55rem; height: .55rem; background: var(--dk); }
#dots i.done { background: var(--lt); }
#dots i.cur { background: var(--white); animation: blink 1s steps(2) infinite; }
#dots i.boss { background: #5a1a22; } #dots i.boss.cur { background: var(--red); }
@keyframes blink { 50% { opacity: .35; } }
.bl { position: absolute; left: 16px; bottom: 16px; max-width: 40vw; }
#build { display: flex; gap: 6px; flex-wrap: wrap-reverse; }
.gi { position: relative; width: 1.9rem; height: 1.9rem; background: var(--ink); display: grid; place-items: center; box-shadow: inset 0 0 0 2px var(--dk); }
.gi img { width: 1.5rem; height: 1.5rem; image-rendering: pixelated; }
.gi span { position: absolute; right: -3px; bottom: -6px; font-size: .55rem; background: var(--ink); padding: 0 2px; color: var(--lt); }
.gi.r1 { box-shadow: inset 0 0 0 2px var(--cyan); } .gi.r2 { box-shadow: inset 0 0 0 2px var(--gold); }
.gi.syn { width: auto; padding: 0 .45rem; color: var(--gold); box-shadow: inset 0 0 0 2px var(--gold); font-size: .6rem; grid-auto-flow: column; gap: .3rem; }
.gi.syn span { position: static; background: none; color: var(--gold); font-size: .6rem; padding: 0; }
.br { position: absolute; right: 16px; bottom: 16px; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.wcard { display: flex; align-items: center; gap: .6rem; background: var(--ink); padding: .4rem .7rem; opacity: .55; transform-origin: right; box-shadow: 3px 3px 0 rgba(0,0,0,.35); }
.wcard img { height: 1.4rem; image-rendering: pixelated; }
.wcard b { display: block; font-size: .78rem; } .wcard small { font-size: .55rem; color: var(--lt); letter-spacing: .06em; }
.wcard.act { opacity: 1; box-shadow: inset 0 0 0 2px var(--white), 3px 3px 0 rgba(0,0,0,.35); padding: .55rem .9rem; }
.wcard.act img { height: 2rem; } .wcard.act b { font-size: 1rem; }
.wcard.empty span { font-size: .6rem; color: var(--mid); }
.bc { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); text-align: center; }
#chroma { position: relative; width: min(34vw, 300px); height: .7rem; background: var(--ink); box-shadow: 0 0 0 2px #050506, 3px 3px 0 2px rgba(0,0,0,.3); }
#chromaFill { position: absolute; inset: 0 auto 0 0; width: 0; background: repeating-linear-gradient(90deg, var(--lt) 0 10px, #807f7a 10px 12px); transition: width .12s; }
#chromaLbl { position: absolute; left: 0; right: 0; bottom: 130%; font-size: .6rem; letter-spacing: .3em; color: var(--lt); }
#chroma.ready #chromaFill, #chroma.active #chromaFill { background: var(--rainbow); background-size: 200% 100%; animation: flow 1.2s linear infinite; }
#chroma.ready { animation: pulse .7s ease-in-out infinite alternate; }
#chroma.ready #chromaLbl { color: var(--white); }
#chroma.ready #chromaLbl::after { content: '  ·  PRESS F'; color: var(--gold); }
@keyframes flow { to { background-position: 200% 0; } }
@keyframes pulse { to { box-shadow: 0 0 0 2px #050506, 0 0 18px 2px rgba(64,228,255,.55); } }
#combo { position: absolute; right: 18px; top: 36%; text-align: right; }
#comboN { display: block; font-size: 2.8rem; line-height: 1; color: var(--white); text-shadow: 3px 3px 0 var(--ink), -1px -1px 0 var(--ink); }
#comboN.pop { animation: pop .18s; }
@keyframes pop { 0% { transform: scale(1.45); } }
#combo small { font-size: .65rem; letter-spacing: .35em; color: var(--ink); background: var(--white); padding: 0 .3rem; }
#combo i { display: block; height: 3px; background: var(--white); margin: .35rem 0 0 auto; }
#combo.hot #comboN { color: var(--gold); } #combo.hot small { background: var(--gold); } #combo.hot i { background: var(--gold); }
#boss { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); width: min(54vw, 620px); }
#boss .bn { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: .3rem; text-shadow: 2px 2px 0 var(--ink); }
#bossName { font-size: 1rem; letter-spacing: .1em; } #bossTitle { font-family: var(--body); font-size: .75rem; color: var(--lt); font-style: italic; }
.bbar { position: relative; height: .75rem; background: var(--ink); box-shadow: 0 0 0 2px #050506, 3px 3px 0 2px rgba(0,0,0,.3); }
.bbar i { position: absolute; inset: 0 auto 0 0; }
#bossLag { background: var(--red); } #bossFill { background: var(--white); }
#boss.p2 #bossFill { background: linear-gradient(var(--white), #e2e1da); }
#bossTicks i { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); }

/* ---------- banners, stamps, toasts ---------- */
#banner { position: fixed; left: 0; right: 0; top: 22vh; text-align: center; pointer-events: none; opacity: 0; font-family: var(--disp); }
#banner b { display: block; font-family: var(--head); font-weight: 400; font-size: clamp(1.9rem, 4.6vw, 4rem); letter-spacing: .06em; text-shadow: 4px 4px 0 var(--ink), -2px -2px 0 var(--ink); }
#banner small { display: inline-block; margin-top: .5rem; font-family: var(--body); font-size: 1rem; color: var(--ink); background: var(--white); padding: .1rem .6rem; }
#banner.show { animation: ban 2.8s cubic-bezier(.2,.9,.2,1) forwards; }
#banner.gold b { color: var(--gold); } #banner.red b { color: var(--red); } #banner.cyan b { color: var(--cyan); }
#banner.chroma b { background: var(--rainbow); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; filter: drop-shadow(4px 4px 0 var(--ink)); animation: flow 1s linear infinite; }
@keyframes ban { 0% { opacity: 0; transform: scale(1.6); letter-spacing: .5em; } 12% { opacity: 1; transform: scale(1); letter-spacing: .08em; } 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(-14px); } }
#stamp { position: fixed; left: 50%; top: 40%; pointer-events: none; opacity: 0; font-family: var(--disp); font-size: clamp(2rem, 5vw, 4rem); color: var(--red); border: .35rem solid var(--red); padding: .1rem 1rem; letter-spacing: .12em; mix-blend-mode: multiply; }
#stamp.show { animation: stamp 1.6s cubic-bezier(.3,1.6,.4,1) forwards; }
@keyframes stamp { 0% { opacity: 0; transform: translate(-50%,-50%) rotate(-9deg) scale(2.4); } 14% { opacity: .95; transform: translate(-50%,-50%) rotate(-9deg) scale(1); } 75% { opacity: .9; } 100% { opacity: 0; transform: translate(-50%,-50%) rotate(-9deg) scale(1); } }
#toasts { position: fixed; left: 50%; bottom: 4.6rem; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 4px; pointer-events: none; }
#toasts .t { font-family: var(--disp); font-size: .78rem; background: var(--ink); padding: .3rem .7rem; box-shadow: 3px 3px 0 rgba(0,0,0,.3); animation: toast 2.6s forwards; text-align: center; }
#toasts .t small { display: block; font-family: var(--body); font-size: .72rem; color: var(--lt); }
#toasts .c { color: var(--cyan); } #toasts .y { color: var(--gold); } #toasts .r { color: var(--red); }
@keyframes toast { 0% { opacity: 0; transform: translateY(8px); } 8% { opacity: 1; transform: none; } 85% { opacity: 1; } 100% { opacity: 0; } }
#vig { position: fixed; inset: 0; pointer-events: none; }
#vig.hurt { animation: vh .55s ease-out; } #vig.shield { animation: vs .4s ease-out; }
@keyframes vh { 0% { box-shadow: inset 0 0 0 9px var(--red), inset 0 0 160px rgba(255,61,74,.6); } 100% { box-shadow: inset 0 0 0 0 transparent; } }
@keyframes vs { 0% { box-shadow: inset 0 0 0 6px var(--white), inset 0 0 120px rgba(255,255,255,.35); } 100% { box-shadow: none; } }
body.lowhp #vig::after { content: ''; position: fixed; inset: 0; animation: lowhp 1.1s ease-in-out infinite; }
@keyframes lowhp { 50% { box-shadow: inset 0 0 90px rgba(255,61,74,.35); } }
#bars i { position: fixed; left: 0; right: 0; height: 0; background: #000; transition: height .5s cubic-bezier(.3,0,.2,1); pointer-events: none; }
#bars i:first-child { top: 0; } #bars i:last-child { bottom: 0; }
body.cine #bars i { height: 11vh; }
#bossCard { position: fixed; left: 8vw; bottom: 16vh; opacity: 0; pointer-events: none; font-family: var(--disp); }
#bossCard small { font-size: .75rem; letter-spacing: .3em; color: var(--red); }
#bossCard b { display: block; font-family: var(--head); font-weight: 400; font-size: clamp(2.2rem, 6vw, 4.8rem); line-height: 1; text-shadow: 4px 4px 0 var(--ink); }
#bossCard i { display: block; font-family: var(--body); font-size: 1.1rem; color: var(--lt); }
#bossCard.show { animation: bcard 2.6s cubic-bezier(.2,.9,.2,1) forwards; }
@keyframes bcard { 0% { opacity: 0; transform: translateX(-40px); } 15% { opacity: 1; transform: none; } 80% { opacity: 1; } 100% { opacity: 0; transform: translateX(20px); } }

/* ---------- glyph cards ---------- */
#cards { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; gap: 1.2rem; background: rgba(8,8,10,.74); padding: 16px; overflow-y: auto; }
#cards > :first-child, .overlay > :first-child { margin-top: auto; } #cards > :last-child, .overlay > :last-child { margin-bottom: auto; } /* centred when it fits, scrollable when it does not */
#cardsTitle { margin: 0; font-family: var(--disp); font-size: 1.3rem; letter-spacing: .3em; color: var(--lt); font-weight: 400; }
#cardRow { display: flex; gap: 1.1rem; flex-wrap: wrap; justify-content: center; align-items: stretch; }
.card { position: relative; width: min(16rem, 86vw); text-align: left; background: #141417; border: 3px solid var(--lt); padding: 1rem 1rem 1.2rem; display: flex; flex-direction: column; gap: .5rem; box-shadow: 6px 6px 0 rgba(0,0,0,.45); animation: cin .45s cubic-bezier(.2,1.4,.4,1) var(--d) both; transition: transform .12s, border-color .12s; }
.card:hover, .card:focus-visible { transform: translateY(-8px); border-color: var(--white); outline: none; }
.card.r1 { border-color: var(--cyan); } .card.r2 { border-color: var(--gold); box-shadow: 6px 6px 0 rgba(0,0,0,.45), 0 0 44px rgba(255,200,61,.22); }
.card .rar { font-family: var(--disp); font-size: .58rem; letter-spacing: .14em; color: var(--lt); }
.card.r1 .rar { color: var(--cyan); } .card.r2 .rar { color: var(--gold); }
.card .ic { width: 4rem; height: 4rem; image-rendering: pixelated; background: var(--ink); padding: .5rem; box-shadow: inset 0 0 0 2px var(--dk); }
.card .nm { font-family: var(--disp); font-size: 1.15rem; line-height: 1.1; }
.card .lv, .card .new { font-size: .6rem; vertical-align: middle; padding: .05rem .3rem; background: var(--white); color: var(--ink); }
.card .new { background: var(--cyan); }
.card .ds { font-size: .95rem; line-height: 1.35; color: #cfcec8; }
.card .ds b { color: var(--white); } .card .ds i { color: var(--mid); font-style: normal; }
em { font-style: normal; } em.c { color: var(--cyan); } em.y { color: var(--gold); } em.o { color: var(--fire); } em.f { color: var(--frost); } em.v { color: var(--violet); }
.card .ad { font-size: .85rem; color: var(--lt); border-top: 2px dashed var(--dk); padding-top: .45rem; }
.card .ad span { font-family: var(--disp); font-size: .6rem; background: var(--dk); color: var(--white); padding: .05rem .3rem; margin-right: .2rem; }
.card .syn { font-family: var(--disp); font-size: .7rem; color: var(--gold); background: rgba(255,200,61,.1); padding: .4rem .5rem; animation: blink 1.4s steps(2) infinite; }
.card .syn small { display: block; font-family: var(--body); font-size: .8rem; color: #e9d9a8; }
.card kbd { position: absolute; top: .7rem; right: .7rem; }
.card.chosen { animation: chosen .38s forwards; }
#cards.out .card:not(.chosen) { opacity: 0; transform: translateY(24px) scale(.96); transition: .25s; }
#cards.out { background: rgba(8,8,10,0); transition: background .35s; }
@keyframes cin { 0% { opacity: 0; transform: translateY(40px) rotate(2deg); } }
@keyframes chosen { 30% { transform: scale(1.06); border-color: var(--white); background: var(--white); color: var(--ink); } 100% { transform: translateY(-30px) scale(.9); opacity: 0; } }
.cardFoot { display: flex; gap: 1rem; align-items: center; font-family: var(--disp); font-size: .7rem; color: var(--mid); }
#reroll { background: var(--ink); border: 2px solid var(--gold); color: var(--gold); font-family: var(--disp); font-size: .72rem; padding: .45rem .8rem; }
#reroll:disabled { border-color: var(--dk); color: var(--mid); cursor: not-allowed; }

/* ---------- title ---------- */
#title { position: fixed; inset: 0; display: flex; flex-direction: column; justify-content: center; padding: 6vh max(16px, 8vw); background: linear-gradient(90deg, rgba(10,10,12,.82) 0%, rgba(10,10,12,.55) 34%, rgba(10,10,12,0) 62%); }
.tmain { display: flex; flex-direction: column; align-items: flex-start; gap: 1.1rem; max-width: 34rem; }
.thint { font-family: var(--disp); font-size: .62rem; color: var(--mid); letter-spacing: .12em; margin-top: -.4rem; }
#title .opts { position: absolute; right: max(16px, 3vw); bottom: max(16px, 3vh); }
.logoWrap { display: flex; align-items: flex-start; gap: 1.2rem; }
#logo { width: min(34rem, 78vw); image-rendering: pixelated; display: block; }
.tag { margin: 0; max-width: 30rem; font-size: 1.15rem; line-height: 1.45; color: #cfcec8; }
.tag b { color: var(--white); font-weight: 600; }
.cta { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; }
#startBtn { font-family: var(--disp); font-size: 1.7rem; letter-spacing: .24em; background: var(--white); color: var(--ink); border: 0; padding: .8rem 2.4rem; margin-top: .4rem; box-shadow: 5px 5px 0 var(--red); transition: transform .1s, box-shadow .1s; }
#startBtn:hover { transform: translate(-2px,-2px); box-shadow: 7px 7px 0 var(--red); }
#startBtn:active { transform: translate(3px,3px); box-shadow: 2px 2px 0 var(--red); }
.cta small { font-family: var(--disp); font-size: .65rem; color: var(--mid); letter-spacing: .1em; }
.touchNote { display: none; font-size: .9rem; color: var(--gold); }
@media (pointer: coarse) { .touchNote { display: block; } }
@media (max-width: 900px) { #title { background: linear-gradient(90deg, rgba(10,10,12,.88) 0%, rgba(10,10,12,.6) 55%, rgba(10,10,12,.2) 100%); } }
@media (max-width: 700px) { .bl { max-width: 60vw; } }

/* ---------- pause / end ---------- */
.overlay { position: fixed; inset: 0; background: rgba(8,8,10,.9); display: flex; flex-direction: column; align-items: center; padding: 16px; overflow-y: auto; }
.pbox { width: min(980px, 100%); display: grid; grid-template-columns: 15rem 1fr; gap: 2.2rem; align-items: start; }
.pbox h2, #end h2 { font-family: var(--head); margin: 0 0 1rem; font-size: 2rem; letter-spacing: .12em; font-weight: 400; }
.menu { display: flex; flex-direction: column; gap: .55rem; }
.menu button { text-align: left; font-family: var(--disp); font-size: .85rem; background: var(--ink2); border: 2px solid var(--dk); padding: .6rem .8rem; letter-spacing: .1em; }
.menu button:hover { border-color: var(--white); }
.menu label { font-family: var(--disp); font-size: .65rem; color: var(--lt); display: flex; flex-direction: column; gap: .3rem; margin-top: .5rem; }
.menu input[type=range] { accent-color: var(--white); }
.pcol h3 { font-family: var(--disp); font-size: .75rem; letter-spacing: .25em; color: var(--lt); margin: 0 0 .6rem; font-weight: 400; }
#pBuild { display: grid; grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr)); gap: .6rem; margin-bottom: 1.4rem; }
#pBuild .row { display: flex; gap: .6rem; background: var(--ink); padding: .5rem; box-shadow: inset 0 0 0 2px var(--dk); }
#pBuild .row.r1 { box-shadow: inset 0 0 0 2px var(--cyanDk, #0a5f74); } #pBuild .row.r2 { box-shadow: inset 0 0 0 2px var(--gold); }
#pBuild img { width: 2rem; height: 2rem; image-rendering: pixelated; flex: none; }
#pBuild b { font-family: var(--disp); font-size: .75rem; } #pBuild b span { color: var(--lt); }
#pBuild p { margin: .2rem 0 0; font-size: .82rem; color: #bdbcb6; line-height: 1.3; }
.none { color: var(--mid); }
#pSyn { display: grid; grid-template-columns: repeat(auto-fill, minmax(13rem, 1fr)); gap: .5rem; }
#pSyn .sy { background: var(--ink); padding: .5rem .6rem; color: var(--mid); }
#pSyn .sy b { font-family: var(--disp); font-size: .7rem; display: block; } #pSyn .sy span { font-size: .75rem; display: block; } #pSyn .sy small { font-size: .75rem; }
#pSyn .sy.on { color: #e9d9a8; box-shadow: inset 0 0 0 2px var(--gold); } #pSyn .sy.on b { color: var(--gold); }
#end .ebox { width: min(760px, 100%); }
#end h2 { font-size: clamp(2rem, 6vw, 4rem); margin-bottom: .3rem; }
#end.win h2 { background: var(--rainbow); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: flow 2s linear infinite; }
#endSub { margin: 0 0 1.6rem; color: var(--lt); font-size: 1.05rem; }
#endStats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; background: var(--dk); margin-bottom: 1.2rem; }
#endStats div { background: var(--ink); padding: .7rem .9rem; }
#endStats small { display: block; font-family: var(--disp); font-size: .6rem; letter-spacing: .2em; color: var(--mid); }
#endStats b { font-family: var(--disp); font-size: 1.5rem; font-variant-numeric: tabular-nums; }
#endBuild { display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; margin-bottom: 1.6rem; min-height: 2rem; }
#endBuild img { width: 2rem; height: 2rem; image-rendering: pixelated; background: var(--ink); padding: 3px; }
#endBuild span { font-family: var(--disp); font-size: .65rem; color: var(--gold); border: 2px solid var(--gold); padding: .3rem .5rem; }
.erow { display: flex; gap: .8rem; flex-wrap: wrap; }
.erow button { font-family: var(--disp); font-size: .95rem; letter-spacing: .14em; padding: .65rem 1.3rem; border: 0; background: var(--white); color: var(--ink); box-shadow: 4px 4px 0 var(--red); }
.erow button.sec { background: var(--ink2); color: var(--white); box-shadow: 4px 4px 0 var(--dk); }
@media (max-width: 760px) { .pbox { grid-template-columns: 1fr; } #endStats { grid-template-columns: repeat(2, 1fr); } }

/* ---------- v2: map, labels, dialogue, frags, foe card, settings, zh ---------- */
.row2 { display: flex; gap: .4rem; }
#frags { display: flex; gap: 5px; align-items: center; }

#labBody h3 { font-family: var(--disp); font-size: .75rem; letter-spacing: .25em; color: var(--lt); margin: 1.2rem 0 .5rem; font-weight: 400; } #labBody h3:first-child { margin-top: 0; }

.lit { display: flex; gap: .6rem; align-items: center; background: var(--ink); padding: .5rem .6rem; box-shadow: inset 0 0 0 1px var(--dk); }
.lit img, .lit .li0 { height: 1.6rem; min-width: 2.2rem; image-rendering: pixelated; object-fit: contain; flex: none; display: flex; align-items: center; justify-content: center; font-family: var(--disp); color: var(--gold); }
.lit div { flex: 1; min-width: 0; } .lit b { font-family: var(--disp); font-size: .74rem; font-weight: 400; display: block; } .lit b small { color: var(--mid); font-size: .6rem; }
.lit p { margin: .15rem 0 0; font-size: .74rem; color: var(--mid); line-height: 1.3; }
.lit button { flex: none; font-family: var(--disp); font-size: .7rem; background: var(--white); color: var(--ink); border: 0; padding: .35rem .6rem; box-shadow: 3px 3px 0 rgba(0,0,0,.4); }
.lit button:disabled { background: var(--dk); color: var(--mid); box-shadow: none; cursor: default; }
.lit em { flex: none; font-family: var(--disp); font-size: .62rem; color: var(--gold); font-style: normal; letter-spacing: .1em; }
.lit.own { box-shadow: inset 0 0 0 2px var(--gold); } .lit.own p { color: #cfcec8; }
#lab { z-index: 10; }
/* v7: leaderboard (title overlay + end-of-run upload) */
#lb { z-index: 10; } #lb .lbox { width: min(820px, 100%); }
#lb .lhead { display: flex; align-items: baseline; gap: 1.2rem; } #lb .lhead h2 { font-family: var(--head); margin: 0 0 1rem; font-size: 2rem; letter-spacing: .12em; font-weight: 400; } #lb #lbClose { margin-left: auto; }
#lbBody table { width: 100%; border-collapse: collapse; font-size: .85rem; } #lbBody th { font-family: var(--disp); font-size: .6rem; letter-spacing: .14em; color: var(--mid); font-weight: 400; text-align: left; padding: .3rem .4rem; border-bottom: 2px solid var(--dk); }
#lbBody td { padding: .35rem .4rem; border-bottom: 1px solid #222228; color: #cfcec8; font-variant-numeric: tabular-nums; } #lbBody td b { font-family: var(--disp); font-weight: 400; color: var(--white); }
#lbBody tr:nth-child(-n+4) td:first-child { color: var(--gold); } #lbBody td.w { color: var(--gold); } #lbBody .none { padding: .6rem 0; }
#endLb { margin: 0 0 1.4rem; } #endLb .lbs { margin: 0 0 .5rem; display: flex; align-items: baseline; gap: .7rem; } #endLb .lbs small { font-family: var(--disp); font-size: .6rem; letter-spacing: .2em; color: var(--mid); } #endLb .lbs b { font-family: var(--disp); font-size: 1.6rem; color: var(--gold); font-weight: 400; }
#endLb .lbf { display: flex; gap: .5rem; flex-wrap: wrap; } #endLb input { font: inherit; font-size: .95rem; background: var(--ink); color: var(--white); border: 2px solid var(--dk); padding: .4rem .6rem; width: 12rem; cursor: text; user-select: text; -webkit-user-select: text; } #endLb input:focus { outline: none; border-color: var(--white); }
#endLb button { font-family: var(--disp); font-size: .8rem; letter-spacing: .1em; background: var(--gold); color: var(--ink); border: 0; padding: .45rem .9rem; box-shadow: 3px 3px 0 rgba(0,0,0,.4); } #endLb button:disabled { background: var(--dk); color: var(--mid); box-shadow: none; cursor: default; }
#lbMsg { display: block; margin-top: .45rem; font-size: .82rem; color: var(--lt); min-height: 1em; } #lbMsg.ok { color: var(--gold); } #lbMsg.no { color: var(--red); }
@media (prefers-reduced-motion: reduce) { #banner.show, #stamp.show, .card, #chroma.ready { animation-duration: .01s; } }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="labels"></div>

<div id="hud" hidden>
  <div class="tl">
    <div class="plate"><div id="hp" class="pips"></div><div id="sh" class="pips"></div></div>
    <div class="row2"><div class="plate coinp"><i class="coin"></i><b id="coins">0</b></div><div class="plate coinp gemp"><i class="gem"></i><b id="gemsN">0</b></div><div class="plate" id="frags"></div></div>
  </div>
  <div class="tr"><div id="floorName"></div><div id="mapWrap"><canvas id="map" width="352" height="256"></canvas><small>TAB</small><div id="mapHint"></div></div></div>
  <div class="bl"><div id="scRow" class="scRow"></div><div id="build"></div></div>
  <div id="br2"><div class="plate" id="power"><span data-t="power">POWER</span><b id="powerN">100</b></div><div class="br" id="wpn"></div></div>
  <div class="bc"><div id="skill" hidden><img id="skillIc" alt=""><i></i><kbd>R</kbd></div><div id="chroma"><i id="chromaFill"></i><span id="chromaLbl" data-t="chroma">CHROMA</span></div></div>
  <div id="combo" hidden><b id="comboN">0</b><small data-t="combo">COMBO</small><i id="comboBar"></i></div>
  <div id="boss" hidden><div class="bn"><b id="bossName"></b><small id="bossTitle"></small></div><div class="bbar"><i id="bossLag"></i><i id="bossFill"></i><span id="bossTicks"></span></div></div>
</div>
<div id="banner"></div>
<div id="stamp"></div>
<div id="toasts"></div>
<div id="tip"></div>
<div id="foe"></div>
<div id="vig"></div>
<div id="bars"><i></i><i></i></div>
<div id="bossCard"></div>

<div id="dlg" class="ui" hidden>
  <img id="dlgPic" alt="">
  <div class="dbody"><b id="dlgName"></b><p id="dlgText"></p><small id="dlgHint"></small></div>
</div>

<div id="cards" class="ui" hidden>
  <h2 id="cardsTitle">CHOOSE A GLYPH</h2>
  <div id="cardRow"></div>
  <div class="cardFoot"><button id="reroll"><span data-t="reroll">REROLL</span> · <span id="rrCost">10G</span></button><span data-t="pickHint">1 · 2 · 3 TO PICK · R TO REROLL</span></div>
</div>

<div id="title" class="ui">
  <div class="tmain">
    <div class="logoWrap"><canvas id="logo" aria-label="Grisaille"></canvas></div>
    <div class="zhTitle" aria-hidden="true">灰 境 · 夺 色</div>
    <p class="tag" data-t="tag" data-html>The world was painted in ink.</p>
    <button id="startBtn" data-t="begin">BEGIN</button>
    <small class="thint" data-t="enterHint">ENTER</small>
    <small id="rec" class="rec"></small>
  </div>
  <div class="opts"><button id="lbBtn" class="optBtn" data-t="lbBtn">LEADERBOARD</button><button class="fsBtn optBtn">FULLSCREEN</button><button class="langBtn optBtn">LANGUAGE</button><button class="shakeBtn optBtn">SHAKE</button></div>
  <p class="touchNote" data-t="touch">Grisaille needs a keyboard and mouse.</p>
</div>

<div id="pause" class="ui overlay" hidden>
  <div class="pbox">
    <div class="menu">
      <h2 data-t="paused">PAUSED</h2>
      <button id="resumeBtn" data-t="resume">RESUME · ESC</button>
      <button id="restartBtn" data-t="restart">RESTART RUN</button>
      <button id="sndBtn">SOUND · ON</button>
      <button class="langBtn">LANGUAGE</button>
      <button class="shakeBtn">SHAKE</button>
      <button class="fsBtn">FULLSCREEN</button>
      <label for="vol"><span data-t="volume">VOLUME</span><input id="vol" type="range" min="0" max="1" step="0.05" value="0.8"></label>
    </div>
    <div class="pcol"><div class="ptabs"><button data-tab="build" data-t="tBuild">BUILD</button><button data-tab="stats" data-t="tStats">STATS</button><button data-tab="codex" data-t="tCodex">CODEX</button><button data-tab="pages" data-t="tPages">PAGES</button></div><div id="pTab"></div></div>
  </div>
</div>

<div id="lab" class="ui overlay" hidden>
  <div class="lbox">
    <div class="lhead"><h2 data-t="lab">RESEARCH TABLE</h2><b class="lgems"><span id="labGems">0</span> ◆</b><button id="labClose" data-t="labHint">ESC · CLOSE</button></div>
    <div class="ltabs ptabs"><button data-tab="w" data-t="tW">WEAPONS</button><button data-tab="h" data-t="tH">HEROES</button><button data-tab="r" data-t="tR">RUNES</button><button data-tab="t" data-t="tT">TALENTS</button><button data-tab="g" data-t="tG">GOALS</button></div>
    <div id="labBody"></div>
  </div>
</div>

<div id="lb" class="ui overlay" hidden>
  <div class="lbox">
    <div class="lhead"><h2 data-t="lbBtn">LEADERBOARD</h2><button id="lbClose" class="optBtn">ESC ✕</button></div>
    <p class="phelp" data-t="lbRule"></p>
    <div id="lbBody"></div>
  </div>
</div>

<div id="end" class="ui overlay" hidden>
  <div class="ebox">
    <h2 id="endTitle"></h2>
    <p id="endSub"></p>
    <div id="endStats"></div>
    <div id="endBuild"></div>
    <p id="endGems"></p>
    <div id="endLb"><p class="lbs"><small data-t="lbScore">SCORE</small><b id="lbScoreN">0</b></p><div class="lbf"><input id="lbNick" type="text" maxlength="12" autocomplete="off" spellcheck="false"><button id="lbSend" data-t="lbSend">UPLOAD SCORE</button></div><small id="lbMsg"></small></div>
    <div class="erow"><button id="againBtn" data-t="again">TRY AGAIN · R</button><button id="menuBtn" class="sec" data-t="toTitle">TITLE</button></div>
  </div>
</div>

<script src="js/core.js"></script>
<script src="js/i18n.js"></script>
<script src="js/audio.js"></script>
<script src="js/world.js"></script>
<script src="js/combat.js"></script>
<script src="js/player.js"></script>
<script src="js/enemies.js"></script>
<script src="js/bosses.js"></script>
<script src="js/story.js"></script>
<script src="js/scenery.js"></script>
<script src="js/ui.js"></script>
<script src="js/rooms.js"></script>
<script src="js/meta.js"></script>
<script src="js/lb.js"></script>
<script src="js/main.js"></script>
<script>drawLogo($('logo'));</script>
</body>
</html>
